name: Build & publish Android APK

# Tag a commit to ship a build:
#   cd mobile && npm version 1.1.0 --no-git-tag-version   # bump package.json
#   git commit -am "Release 1.1.0" && git tag v1.1.0 && git push --follow-tags
#
# The tag must match mobile/package.json's version — the app compares its own
# baked-in version against the release tag, so a mismatch would make it either
# nag forever or never notice an update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Resolve version
        id: v
        working-directory: mobile
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag v$TAG does not match mobile/package.json version $VERSION. Bump package.json and re-tag."
              exit 1
            fi
          fi
          echo "Building version $VERSION"

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        # android/ is gitignored, so it's regenerated from www/ on every run.
        run: |
          npx cap add android
          node scripts/patch-android.js
          node scripts/set-version.js

      - name: Build unsigned release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Android only installs an update over an existing app when both are signed with the SAME key, so an unsigned/ad-hoc build is not publishable. See mobile/README.md → Releasing a build."
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks

          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="journey-to-poster-${{ steps.v.outputs.version }}.apk"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
          "$APKSIGNER" sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$OUT" /tmp/aligned.apk
          "$APKSIGNER" verify --print-certs "$OUT"

          rm -f /tmp/release.jks /tmp/aligned.apk
          echo "Built $OUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: journey-to-poster-${{ steps.v.outputs.version }}
          path: mobile/journey-to-poster-${{ steps.v.outputs.version }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/journey-to-poster-${{ steps.v.outputs.version }}.apk
          generate_release_notes: true
