<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1465F1">
<title>Journey To Poster</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="splash">
    <div class="splash__stage">
        <div class="splash__logo-wrap">
            <span class="splash__orbit"></span>
            <img id="splashLogo" class="splash__logo" src="img/journey-to-logo.png" alt="">
            <span id="splashFallback" class="splash__fallback" hidden>JT</span>
        </div>
        <h1 class="splash__wordmark" aria-label="Journey To">
            <span class="splash__word"><span style="animation-delay:.36s;color:#1465F1">J</span><span style="animation-delay:.42s;color:#146FE0">O</span><span style="animation-delay:.48s;color:#147ACF">U</span><span style="animation-delay:.54s;color:#1484BE">R</span><span style="animation-delay:.60s;color:#148EAE">N</span><span style="animation-delay:.66s;color:#14989D">E</span><span style="animation-delay:.72s;color:#14A38C">Y</span></span>
            <span class="splash__word"><span style="animation-delay:.80s;color:#14AD7C">T</span><span style="animation-delay:.86s;color:#12B76A">O</span></span>
        </h1>
    </div>
    <p class="splash__credit">Powered by Tweller Studios &copy; 2026</p>
</div>

<main id="view"></main>

<nav id="tabbar" style="display:none;">
    <button data-tab="posts" class="tab tab--active">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
        <span class="tab-label">Posts</span>
    </button>
    <button data-tab="editor" class="tab">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>
        <span class="tab-label">New Post</span>
    </button>
    <button data-tab="settings" class="tab">
        <span class="tab-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="tab-label">Settings</span>
    </button>
</nav>

<div id="toast" style="display:none;"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
